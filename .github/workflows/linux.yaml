# Linux build and tests (-DX4VR_LINUX=ON), the two ways README.md describes: CMake with the
# distribution's packages (OpenVR fetched), and Nix. Runs when files the Linux build reads change.
# Nothing is published; the Windows build isn't touched.
name: Linux

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - include/**
      - src/**
      - tools/**
      - tests/**
      - linux/**
      - config/linux/**
      - .github/workflows/linux.yaml
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - include/**
      - src/**
      - tools/**
      - tests/**
      - linux/**
      - config/linux/**
      - .github/workflows/linux.yaml

permissions:
  contents: read

jobs:
  cmake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libvulkan-dev
      - run: cmake -S . -B build -DX4VR_LINUX=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: nix-build linux/nix # builds and runs the tests (doCheck)
